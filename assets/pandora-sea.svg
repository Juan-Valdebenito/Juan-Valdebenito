<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <style>
    .surface { animation: drift 8s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-160px); } }

    .ray { animation: ray 6s ease-in-out infinite; }
    @keyframes ray { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.3; } }

    .tulkun { animation: tulkun 40s ease-in-out infinite alternate; }
    @keyframes tulkun { from { transform: translateX(60px); } to { transform: translateX(-80px); } }

    .sway { animation: sway 5s ease-in-out infinite; transform-origin: 0px 0px; }
    @keyframes sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

    .pulse-a { animation: glowpulse 3s ease-in-out infinite; }
    @keyframes glowpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .bubble { animation: bubble 7s linear infinite; }
    @keyframes bubble {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.8; }
      50%  { transform: translate(5px, -110px); }
      90%  { opacity: 0.6; }
      100% { transform: translate(-3px, -215px); opacity: 0; }
    }

    .school { animation: school 26s linear infinite; }
    @keyframes school {
      from { transform: translate(-120px, 0); }
      50%  { transform: translate(440px, -18px); }
      to   { transform: translate(1000px, 6px); }
    }

    .swim1 { animation: swim 18s ease-in-out infinite alternate; }
    .swim2 { animation: swim 22s ease-in-out infinite alternate-reverse; }
    @keyframes swim { from { transform: translateX(-45px); } to { transform: translateX(45px); } }

    .undulate { animation: undulate 3.6s ease-in-out infinite; }
    @keyframes undulate { 0%, 100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-7px) rotate(2.5deg); } }

  </style>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11679A"/>
      <stop offset="0.35" stop-color="#0A3570"/>
      <stop offset="1" stop-color="#030E26"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFF6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#BFF6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phrase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9EC"/>
      <stop offset="1" stop-color="#E0D2FF"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="260" rx="16"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="260" fill="url(#water)"/>

    <!-- Superficie vista desde abajo -->
    <g class="surface">
      <path d="M-160 0 H1060 V14 Q1050 9 1040 14 Q1030 20 1020 14 Q1010 9 1000 14 Q990 20 980 14 Q970 9 960 14 Q950 20 940 14 Q930 9 920 14 Q910 20 900 14 Q890 9 880 14 Q870 20 860 14 Q850 9 840 14 Q830 20 820 14 Q810 9 800 14 Q790 20 780 14 Q770 9 760 14 Q750 20 740 14 Q730 9 720 14 Q710 20 700 14 Q690 9 680 14 Q670 20 660 14 Q650 9 640 14 Q630 20 620 14 Q610 9 600 14 Q590 20 580 14 Q570 9 560 14 Q550 20 540 14 Q530 9 520 14 Q510 20 500 14 Q490 9 480 14 Q470 20 460 14 Q450 9 440 14 Q430 20 420 14 Q410 9 400 14 Q390 20 380 14 Q370 9 360 14 Q350 20 340 14 Q330 9 320 14 Q310 20 300 14 Q290 9 280 14 Q270 20 260 14 Q250 9 240 14 Q230 20 220 14 Q210 9 200 14 Q190 20 180 14 Q170 9 160 14 Q150 20 140 14 Q130 9 120 14 Q110 20 100 14 Q90 9 80 14 Q70 20 60 14 Q50 9 40 14 Q30 20 20 14 Q10 9 0 14 Q-10 20 -20 14 Q-30 9 -40 14 Q-50 20 -60 14 Q-70 9 -80 14 Q-90 20 -100 14 Q-110 9 -120 14 Q-130 20 -140 14 Q-150 9 -160 14 Z" fill="#6FD3F0" fill-opacity="0.22"/>
      <path d="M-160 16 Q-150 10 -140 16 Q-130 22 -120 16 Q-110 10 -100 16 Q-90 22 -80 16 Q-70 10 -60 16 Q-50 22 -40 16 Q-30 10 -20 16 Q-10 22 0 16 Q10 10 20 16 Q30 22 40 16 Q50 10 60 16 Q70 22 80 16 Q90 10 100 16 Q110 22 120 16 Q130 10 140 16 Q150 22 160 16 Q170 10 180 16 Q190 22 200 16 Q210 10 220 16 Q230 22 240 16 Q250 10 260 16 Q270 22 280 16 Q290 10 300 16 Q310 22 320 16 Q330 10 340 16 Q350 22 360 16 Q370 10 380 16 Q390 22 400 16 Q410 10 420 16 Q430 22 440 16 Q450 10 460 16 Q470 22 480 16 Q490 10 500 16 Q510 22 520 16 Q530 10 540 16 Q550 22 560 16 Q570 10 580 16 Q590 22 600 16 Q610 10 620 16 Q630 22 640 16 Q650 10 660 16 Q670 22 680 16 Q690 10 700 16 Q710 22 720 16 Q730 10 740 16 Q750 22 760 16 Q770 10 780 16 Q790 22 800 16 Q810 10 820 16 Q830 22 840 16 Q850 10 860 16 Q870 22 880 16 Q890 10 900 16 Q910 22 920 16 Q930 10 940 16 Q950 22 960 16 Q970 10 980 16 Q990 22 1000 16 Q1010 10 1020 16 Q1030 22 1040 16 Q1050 10 1060 16" fill="none" stroke="#BFF6FF" stroke-opacity="0.5" stroke-width="1.2"/>
    </g>

    <!-- Rayos de luz -->
    <polygon class="ray" style="animation-delay: -0.0s" points="60,0 100,0 190,260 130,260" fill="url(#ray)"/>
    <polygon class="ray" style="animation-delay: -1.3s" points="220,0 246,0 336,260 297,260" fill="url(#ray)"/>
    <polygon class="ray" style="animation-delay: -2.6s" points="400,0 450,0 540,260 465,260" fill="url(#ray)"/>
    <polygon class="ray" style="animation-delay: -3.9s" points="590,0 620,0 710,260 665,260" fill="url(#ray)"/>
    <polygon class="ray" style="animation-delay: -5.2s" points="760,0 804,0 894,260 828,260" fill="url(#ray)"/>

    <!-- Tulkun a lo lejos -->
    <g transform="translate(560 92)" opacity="0.5">
      <g class="tulkun" fill="#082650" stroke="#2C6FB8" stroke-opacity="0.6">
        <path d="M-120 0 C-110 -24 -60 -34 0 -30 C50 -28 90 -16 120 -6 C140 -2 160 -10 176 -22 C172 -6 170 6 178 22 C160 10 140 6 120 8 C80 18 30 26 -30 24 C-80 22 -115 14 -120 0 Z"/>
        <path d="M-80 -22 L-70 -32 L-58 -26 M-40 -30 L-30 -40 L-18 -31 M0 -30 L10 -38 L20 -29" fill="none" stroke="#2C6FB8" stroke-opacity="0.7"/>
        <path d="M-30 20 C-24 34 -14 44 -4 46 C-8 36 -10 28 -6 22 Z"/>
        <circle cx="-96" cy="-4" r="2" fill="#7DF9EC" stroke="none"/>
      </g>
    </g>

    <!-- Cardumen -->
    <g transform="translate(0 70)"><g class="school" fill="#7DF9EC" fill-opacity="0.8" filter="url(#glow)"><path d="M0 0 q6 -3 10 0 q-4 3 -10 0 Z M0 0 l-3 -2 l0 4 Z"/><path d="M16 -6 q6 -3 10 0 q-4 3 -10 0 Z M16 -6 l-3 -2 l0 4 Z"/><path d="M14 8 q6 -3 10 0 q-4 3 -10 0 Z M14 8 l-3 -2 l0 4 Z"/><path d="M30 0 q6 -3 10 0 q-4 3 -10 0 Z M30 0 l-3 -2 l0 4 Z"/><path d="M28 -12 q6 -3 10 0 q-4 3 -10 0 Z M28 -12 l-3 -2 l0 4 Z"/><path d="M44 -4 q6 -3 10 0 q-4 3 -10 0 Z M44 -4 l-3 -2 l0 4 Z"/><path d="M42 8 q6 -3 10 0 q-4 3 -10 0 Z M42 8 l-3 -2 l0 4 Z"/><path d="M58 -2 q6 -3 10 0 q-4 3 -10 0 Z M58 -2 l-3 -2 l0 4 Z"/></g></g>

