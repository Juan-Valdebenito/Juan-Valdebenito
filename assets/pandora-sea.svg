      <g transform="translate(44 232)"><g class="sway" style="animation-delay: -2.4s"><path d="M0 0 C-8 -32 8 -63 -4 -96" fill="none" stroke="#9B6BFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-4" cy="-96" r="2" fill="#9B6BFF"/></g></g>
      <g transform="translate(60 232)"><g class="sway" style="animation-delay: -4.0s"><path d="M0 0 C0 -19 0 -38 0 -58" fill="none" stroke="#58E6D9" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="0" cy="-58" r="2" fill="#58E6D9"/></g></g>
      <g transform="translate(330 232)"><g class="sway" style="animation-delay: -1.2s"><path d="M0 0 C-14 -21 -4 -42 -7 -64" fill="none" stroke="#58E6D9" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-7" cy="-64" r="2" fill="#58E6D9"/></g></g>
      <g transform="translate(346 232)"><g class="sway" style="animation-delay: -2.9s"><path d="M0 0 C-12 -28 8 -55 -6 -84" fill="none" stroke="#9B6BFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-6" cy="-84" r="2" fill="#9B6BFF"/></g></g>
      <g transform="translate(500 232)"><g class="sway" style="animation-delay: -1.2s"><path d="M0 0 C-7 -17 -13 -34 -4 -52" fill="none" stroke="#58E6D9" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-4" cy="-52" r="2" fill="#58E6D9"/></g></g>
      <g transform="translate(780 232)"><g class="sway" style="animation-delay: -5.0s"><path d="M0 0 C7 -30 11 -59 3 -90" fill="none" stroke="#58E6D9" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="3" cy="-90" r="2" fill="#58E6D9"/></g></g>
