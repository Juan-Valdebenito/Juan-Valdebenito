      <g transform="translate(560 230)"><g class="pulse-a" style="animation-delay: -1.7s"><g stroke="#FF8AD8" stroke-width="1.4" stroke-linecap="round"><path d="M0 0 L-9 -8"/><path d="M0 0 L-6 -12"/><path d="M0 0 L-2 -14"/><path d="M0 0 L2 -14"/><path d="M0 0 L6 -12"/><path d="M0 0 L9 -8"/></g><g fill="#FFD1F1"><circle cx="-9" cy="-8" r="1.4"/><circle cx="-6" cy="-12" r="1.4"/><circle cx="-2" cy="-14" r="1.4"/><circle cx="2" cy="-14" r="1.4"/><circle cx="6" cy="-12" r="1.4"/><circle cx="9" cy="-8" r="1.4"/></g></g></g>
      <g transform="translate(700 230)"><g class="pulse-a" style="animation-delay: -1.0s"><g stroke="#FF8AD8" stroke-width="1.4" stroke-linecap="round"><path d="M0 0 L-9 -8"/><path d="M0 0 L-6 -12"/><path d="M0 0 L-2 -14"/><path d="M0 0 L2 -14"/><path d="M0 0 L6 -12"/><path d="M0 0 L9 -8"/></g><g fill="#FFD1F1"><circle cx="-9" cy="-8" r="1.4"/><circle cx="-6" cy="-12" r="1.4"/><circle cx="-2" cy="-14" r="1.4"/><circle cx="2" cy="-14" r="1.4"/><circle cx="6" cy="-12" r="1.4"/><circle cx="9" cy="-8" r="1.4"/></g></g></g>
      <g transform="translate(740 230)"><g class="pulse-a" style="animation-delay: -1.5s"><g stroke="#FF8AD8" stroke-width="1.4" stroke-linecap="round"><path d="M0 0 L-9 -8"/><path d="M0 0 L-6 -12"/><path d="M0 0 L-2 -14"/><path d="M0 0 L2 -14"/><path d="M0 0 L6 -12"/><path d="M0 0 L9 -8"/></g><g fill="#FFD1F1"><circle cx="-9" cy="-8" r="1.4"/><circle cx="-6" cy="-12" r="1.4"/><circle cx="-2" cy="-14" r="1.4"/><circle cx="2" cy="-14" r="1.4"/><circle cx="6" cy="-12" r="1.4"/><circle cx="9" cy="-8" r="1.4"/></g></g></g>
    </g>
    <g fill="none" stroke="#DFF9FF" stroke-opacity="0.7">
      <circle class="bubble" cx="40" cy="228" r="2" style="animation-duration: 7s; animation-delay: -0s"/>
      <circle class="bubble" cx="52" cy="228" r="1.4" style="animation-duration: 6s; animation-delay: -2s"/>
      <circle class="bubble" cx="338" cy="228" r="2.2" style="animation-duration: 8s; animation-delay: -1s"/>
