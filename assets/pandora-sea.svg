      <g transform="translate(812 232)"><g class="sway" style="animation-delay: -2.5s"><path d="M0 0 C-11 -34 13 -69 -5 -104" fill="none" stroke="#58E6D9" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-5" cy="-104" r="2" fill="#58E6D9"/></g></g>
      <g transform="translate(842 232)"><g class="sway" style="animation-delay: -1.8s"><path d="M0 0 C-10 -20 9 -40 -5 -60" fill="none" stroke="#9B6BFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/><circle cx="-5" cy="-60" r="2" fill="#9B6BFF"/></g></g>
    </g>
    <g filter="url(#glow)">
      <g transform="translate(100 230)"><g class="pulse-a" style="animation-delay: -0.4s"><g stroke="#FF8AD8" stroke-width="1.4" stroke-linecap="round"><path d="M0 0 L-9 -8"/><path d="M0 0 L-6 -12"/><path d="M0 0 L-2 -14"/><path d="M0 0 L2 -14"/><path d="M0 0 L6 -12"/><path d="M0 0 L9 -8"/></g><g fill="#FFD1F1"><circle cx="-9" cy="-8" r="1.4"/><circle cx="-6" cy="-12" r="1.4"/><circle cx="-2" cy="-14" r="1.4"/><circle cx="2" cy="-14" r="1.4"/><circle cx="6" cy="-12" r="1.4"/><circle cx="9" cy="-8" r="1.4"/></g></g></g>
