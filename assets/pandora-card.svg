<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="420" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <style>
    .tendrils path { animation: shimmer 4s ease-in-out infinite; }
    .tendrils path:nth-child(3n)   { animation-delay: -1.3s; }
    .tendrils path:nth-child(3n+1) { animation-delay: -2.6s; }
    .tendrils path:nth-child(4n)   { animation-duration: 5.5s; }
    @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .stars circle { animation: twinkle 3s ease-in-out infinite; }
    .stars circle:nth-child(2n) { animation-delay: -1s; animation-duration: 4s; }
    .stars circle:nth-child(3n) { animation-delay: -2s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .sprite { animation: rise 11s linear infinite; opacity: 0; }
    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      15%  { opacity: 1; }
      50%  { transform: translate(8px, -110px); }
      85%  { opacity: 0.8; }
      100% { transform: translate(-6px, -220px); opacity: 0; }
    }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .ikran-fly { animation: glide 7s ease-in-out infinite alternate; }
    @keyframes glide {
      0%   { transform: translate(-18px, 6px) rotate(-3deg); }
      50%  { transform: translate(4px, -8px) rotate(2deg); }
      100% { transform: translate(18px, 2px) rotate(-1deg); }
    }
    .wing { animation: flap 1.6s ease-in-out infinite; transform-origin: 0px 0px; }
    .wing-hind { animation-delay: -0.4s; }
    @keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
  </style>
