<svg width="880" height="420" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070F"/>
      <stop offset="0.6" stop-color="#0B1A3A"/>
      <stop offset="1" stop-color="#1A1050"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58E6D9"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58E6D9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58E6D9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1E3F"/>
      <stop offset="1" stop-color="#03070F"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="420" rx="16"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <!-- Cielo nocturno -->
    <rect width="880" height="420" fill="url(#sky)"/>

    <!-- Estrellas -->
    <g fill="#FFFFFF">
      <circle cx="40" cy="30" r="1"/>   <circle cx="95" cy="70" r="0.8"/> <circle cx="150" cy="22" r="1.2"/>
      <circle cx="210" cy="55" r="0.8"/> <circle cx="268" cy="18" r="1"/>  <circle cx="330" cy="62" r="0.7"/>
      <circle cx="372" cy="28" r="1"/>  <circle cx="420" cy="14" r="0.8"/> <circle cx="470" cy="40" r="0.7"/>
      <circle cx="530" cy="20" r="1"/>  <circle cx="600" cy="34" r="0.8"/> <circle cx="655" cy="12" r="1.1"/>
      <circle cx="710" cy="44" r="0.7"/> <circle cx="770" cy="20" r="1"/>  <circle cx="830" cy="38" r="0.8"/>
      <circle cx="60" cy="120" r="0.7"/> <circle cx="120" cy="150" r="0.9"/> <circle cx="300" cy="110" r="0.8"/>
      <circle cx="860" cy="90" r="0.7"/> <circle cx="18" cy="190" r="0.8"/>
    </g>

    <!-- Suelo -->
    <path d="M0 372 Q110 344 230 366 T470 370 T700 360 T880 374 V420 H0 Z" fill="url(#ground)"/>
    <path d="M0 372 Q110 344 230 366 T470 370 T700 360 T880 374" fill="none" stroke="#58E6D9" stroke-opacity="0.35"/>

    <!-- Datos -->
    <text x="420" y="78" font-size="26" font-weight="bold" fill="url(#name)" filter="url(#glow)">Juan Pablo Valdebenito</text>
    <text x="420" y="104" font-size="13" fill="#8FB8E8">Estudiante de Ingeniería Civil Informática</text>
    <rect x="420" y="120" width="420" height="1.5" fill="url(#rule)"/>

    <g font-size="12">
      <g fill="#58E6D9" letter-spacing="1">
        <text x="420" y="152">◆ RUTA</text>
        <text x="420" y="182">◆ LENGUAJES</text>
        <text x="420" y="212">◆ FRAMEWORK</text>
        <text x="420" y="242">◆ HERRAMIENTAS</text>
        <text x="420" y="272">◆ SISTEMAS</text>
        <text x="420" y="302">◆ ESTADO</text>
      </g>
      <g fill="#E6F1FF">
        <text x="560" y="152">Software · Web · Data Science</text>
        <text x="560" y="182">TypeScript · JavaScript · Python · C++</text>
        <text x="560" y="212">React</text>
        <text x="560" y="242">GitHub · Terraform · Vercel</text>
        <text x="560" y="272">Linux · Windows</text>
        <text x="560" y="302">Estudiante · aprendiendo cada día</text>
      </g>
    </g>

    <!-- Pie -->
    <text x="420" y="402" font-size="10" fill="#58E6D9" letter-spacing="1">● TSAHEYLU ESTABLISHED</text>
    <text x="860" y="402" text-anchor="end" font-size="10" fill="#9B6BFF" letter-spacing="1">OEL NGATI KAMEIE · I SEE YOU</text>
  </g>

  <!-- Borde -->
  <rect x="0.75" y="0.75" width="878.5" height="418.5" rx="16" fill="none" stroke="url(#name)" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
