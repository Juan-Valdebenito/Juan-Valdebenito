<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <style>
    .pulse { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 5 95; animation: travel 4s linear infinite; }
    @keyframes travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

    .node { animation: node 3s ease-in-out infinite; }
    @keyframes node { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .core { animation: core 4s ease-in-out infinite; transform-origin: 440px 128px; }
    @keyframes core { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.6); opacity: 0.15; } }

    .halo { animation: core 4s ease-in-out infinite; }
    .halo-1 { transform-origin: 190px 92px; animation-delay: -1.3s; }
    .halo-2 { transform-origin: 690px 168px; animation-delay: -2.6s; }

    .spores circle { animation: node 4s ease-in-out infinite; }
    .spores circle:nth-child(2n) { animation-delay: -1.5s; animation-duration: 5s; }
    .spores circle:nth-child(3n) { animation-delay: -2.8s; }

    .blink { animation: node 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1E3F"/>
      <stop offset="1" stop-color="#03070F"/>
    </linearGradient>
    <linearGradient id="phrase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9EC"/>
      <stop offset="1" stop-color="#E0D2FF"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#7DF9EC"/>
      <stop offset="1" stop-color="#7DF9EC" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="880" height="240" rx="16"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

