<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <style>
    .float { animation: float 8s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .flow { animation: flow 0.9s linear infinite; }
    .flow2 { animation-duration: 1.3s; }
    @keyframes flow { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }

    .mist-puff { animation: puff 3s ease-in-out infinite; }
    @keyframes puff { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .glint { animation: puff 3s ease-in-out infinite; }

    .cloud-a { animation: drift linear infinite; }
    .cloud-b { animation: drift linear infinite reverse; }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(80px); } }

    .stars circle { animation: puff 3.5s ease-in-out infinite; }
    .stars circle:nth-child(2n) { animation-delay: -1.5s; }

    .phrase1 { animation: float 6s ease-in-out infinite; }
    .phrase2 { animation: float 7s ease-in-out infinite; animation-delay: -3s; }

    .blink { animation: puff 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070F"/>
      <stop offset="0.55" stop-color="#0B1A3A"/>
      <stop offset="1" stop-color="#2A1A6B"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFF6FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#BFF6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phrase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9EC"/>
      <stop offset="1" stop-color="#E0D2FF"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="240" rx="16"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

